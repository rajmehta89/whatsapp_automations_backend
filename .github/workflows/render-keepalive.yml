name: Render Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://whatsapp-automations-backend.onrender.com/healthz" > /dev/null

      - name: Ping WhatsApp status endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://whatsapp-automations-backend.onrender.com/api/whatsapp/status" > /dev/null
